<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuva Sangam 2026</title>
    <script type="text/javascript">
      // Single Page Apps redirect for GitHub Pages
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        // Preserve repo name if hosted on github.io subfolder (e.g., username.github.io/repo-name/)
        var repoName = (l.hostname.endsWith('github.io') && pathSegments.length > 0) ? '/' + pathSegments[0] : '';
        window.location.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoName + '/' + (l.search || '') + (l.hash || '')
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
